# Русский — основной язык бота. Если в другом файле нет какого-то ключа,
# бот возьмёт текст отсюда.
#
# Подстановки в фигурных скобках ({group}, {time} …) бот заполняет сам —
# их нельзя переводить или удалять. HTML-теги (<b>, <code>) можно оставить как есть.

[lang]
name = "Русский"
prompt = "🌐 Выберите язык"
chosen = "✅ Язык: русский"

[buttons]
# кнопки под полем ввода
now = "🕐 Сейчас"
today = "📅 Сегодня"
tomorrow = "➡️ Завтра"
week = "🗓 Неделя"
next_week = "⏭ Через неделю"

[periods]
# переключатель под карточкой преподавателя или чужой группы
now = "Сейчас"
today = "Сегодня"
tomorrow = "Завтра"
week = "Неделя"
next_week = "Через неделю"

[commands]
# описания команд в меню бота
teacher = "Расписание преподавателя"
subject = "Найти преподавателя по предмету"
group = "Сменить группу"
language = "Язык / Language / Idioma"

[start]
hello = "Привет! Я показываю расписание ВГПУ с сайта rsp-vspu.online."

[group]
prompt = """Напиши название своей группы. Можно не целиком: например, <code>АН 251</code> найдёт <code>ИЯ-АН_Оb251</code>.

Или выбери группу из списка 👇"""
from_list = "📋 Выбрать из списка"
not_found = "Не нашёл такую группу 🤔 Попробуй написать иначе или выбери из списка."
saved = """✅ Группа: <b>{group}</b>

Расписание — кнопками внизу: сейчас, сегодня, завтра, эта или следующая неделя.
Расписание преподавателя — /teacher или просто напиши его фамилию. Сменить группу — /group, язык — /language."""
choose_first = "Сначала выбери свою группу."
pin = "📌 Сделать моей группой"
pinned_toast = "📌 Сохранено"
pinned = "✅ Теперь твоя группа: <b>{group}</b>. Её расписание — кнопками внизу."
nav_faculty = "Выбери факультет:"
nav_direction = "Факультет {faculty}. Выбери направление:"
nav_group = "Направление {direction}. Выбери группу:"

[teacher]
prompt = """Чьё расписание посмотреть? Напиши фамилию преподавателя, например <code>Анисимова</code>. Твоя группа при этом не изменится.

Или найди по первой букве 👇"""
by_letter = "🔤 Выбрать по букве фамилии"
not_found = "Не нашёл такого преподавателя 🤔 Попробуй иначе или выбери по букве."
nav_letter = "Выбери первую букву фамилии:"
nav_list = "Преподаватели на «{letter}»:"

[subject]
prompt = """Какой предмет? Напиши часть названия, например <code>философия</code>.

Найду, кто его ведёт и в каких группах."""
not_found = "Не нашёл такой предмет в расписании на сайте 🤔 Попробуй написать иначе."
building = "Список предметов ещё собирается с сайта — попробуй через несколько минут."
too_many = "Под запрос подходит {count} предметов — уточни, пожалуйста."
title = "📚 Предмет: «{query}»"
legend = "⭐ — ведёт в твоей группе"
updated = "По расписанию на сайте, обновлено {date}."
more = "И ещё {count} — уточни запрос, чтобы увидеть их."
open_hint = "Нажми на преподавателя, чтобы открыть его расписание 👇"

[search]
pick = "Выбери из найденного:"
too_many = "Нашлось {count} вариантов — уточни запрос, пожалуйста."
not_understood = "Не понял 🤔 Напиши название группы или фамилию преподавателя. Команды — /help"

[common]
back = "« Назад"
site_down = "😔 Сайт расписания сейчас не отвечает. Попробуй чуть позже."
stale_button = "Эта кнопка устарела 🙂 Открой расписание заново."
reset_done = "🗑 Твои данные удалены."
help = """Кнопки внизу — расписание твоей группы: сейчас, сегодня, завтра, эта или следующая неделя.

/teacher — расписание преподавателя (группа не меняется)
/subject — найти преподавателя по предмету
/group — сменить группу
/language — сменить язык

Ещё можно просто написать фамилию преподавателя или название другой группы — покажу их расписание."""

[schedule]
weekdays = ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота", "Воскресенье"]
# месяцы в родительном падеже: «5 октября»
months = ["января", "февраля", "марта", "апреля", "мая", "июня",
          "июля", "августа", "сентября", "октября", "ноября", "декабря"]
